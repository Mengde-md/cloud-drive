spring.datasource.url=${CLOUDDRIVE_DB_URL}
spring.datasource.username=${CLOUDDRIVE_DB_USERNAME}
spring.datasource.password=${CLOUDDRIVE_DB_PASSWORD}
clouddrive.security.jwt.secret=${CLOUDDRIVE_JWT_SECRET}
clouddrive.internal.service-token=${CLOUDDRIVE_INTERNAL_SERVICE_TOKEN}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
