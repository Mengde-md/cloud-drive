# Day25 真实形态：`--spring.profiles.active=nacos` 时生效。
# 与 gateway/src/main/resources/application-nacos.yml 逐项对齐，变量名共用同一组。

spring:
  config:
    import:
      - optional:nacos:${CLOUDDRIVE_AUTH_APP_NAME:cloud-drive-auth}.yaml

  cloud:
    nacos:
      discovery:
        enabled: true
        # Match the default loopback listener; remote deployments must set a reachable address.
        ip: ${CLOUDDRIVE_AUTH_ADVERTISED_IP:127.0.0.1}
        server-addr: ${CLOUDDRIVE_NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${CLOUDDRIVE_NACOS_USERNAME:}
        password: ${CLOUDDRIVE_NACOS_PASSWORD:}
        namespace: ${CLOUDDRIVE_NACOS_NAMESPACE:}
        group: ${CLOUDDRIVE_NACOS_GROUP:CLOUDDRIVE_GROUP}
      config:
        enabled: true
        server-addr: ${CLOUDDRIVE_NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${CLOUDDRIVE_NACOS_USERNAME:}
        password: ${CLOUDDRIVE_NACOS_PASSWORD:}
        namespace: ${CLOUDDRIVE_NACOS_NAMESPACE:}
        group: ${CLOUDDRIVE_NACOS_GROUP:CLOUDDRIVE_GROUP}
        file-extension: yaml
        refresh-enabled: true
