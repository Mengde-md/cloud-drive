server:
  port: ${CLOUDDRIVE_GATEWAY_PORT:9000}

spring:
  application:
    # 这个名字同时是 Nacos 上的服务名与配置 dataId 前缀，必须与 deploy/.env 中的
    # CLOUDDRIVE_GATEWAY_APP_NAME 保持一致，否则注册上去的实例名与配置查不到同一处。
    name: ${CLOUDDRIVE_GATEWAY_APP_NAME:cloud-drive-gateway}
  main:
    web-application-type: reactive

  cloud:
    nacos:
      # Day24 默认形态：Nacos 全部关闭。
      #
      # 这样做不是因为 Nacos 可选，而是因为"构建与测试不应依赖一个必须先手工启动的
      # 外部中间件"。默认关闭后，gateway 的路由表测试在任何机器上都能跑；真实的
      # 注册发现走 `--spring.profiles.active=nacos`，由 deploy/docker-compose.yml
      # 起的 Nacos 提供。
      discovery:
        enabled: false
      config:
        enabled: false
        # spring-cloud-starter-alibaba-nacos-config 在 Spring Boot 3 下默认会检查
        # 是否存在 spring.config.import=nacos:...，查不到就直接启动失败。默认形态
        # 下我们没有这一项，所以必须显式关掉这个检查，否则连 mvn test 都起不来。
        import-check:
          enabled: false

    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 10s
      default-filters:
        # 让任何一次真实转发都能在响应头上看出"是网关转发的、走的哪条路由"，
        # 手工验证与故障排查都靠它，不需要去翻日志。
        - AddResponseHeader=X-CloudDrive-Gateway, day24
      routes:
        # 路由 id 按 Day23《day23-service-boundaries.md》定下的四个未来服务命名，
        # 而不是按今天的进程数命名。今天四条的 uri 是同一个地址；Day25 拆出
        # auth-service 后只改 auth-service-route 一条的 uri，其余三条不动。
        # Day25：这条路由的 uri 今天第一次真正指向另一个进程。
        # 路由 id、Path 谓词一个字没改——Day24 按未来服务名命名路由的收益在这里兑现。
        #
        # 注意 Path 是 /api/auth/**，而 auth-service 上还挂着 /internal/**。
        # /internal/** 不在任何一条路由的谓词里，所以它从网关**不可达**，
        # 只能由集群内部直连。GatewayRouteTableTest 有一条断言专门钉死这一点。
        - id: auth-service-route
          uri: ${clouddrive.gateway.auth-uri}
          predicates:
            - Path=/api/auth/**

        - id: user-service-route
          uri: ${clouddrive.gateway.user-uri}
          predicates:
            - Path=/api/entries/**

        - id: file-service-route
          uri: ${clouddrive.gateway.file-uri}
          predicates:
            - Path=/api/files/**,/api/upload-sessions/**

        - id: share-service-route
          uri: ${clouddrive.gateway.file-uri}
          predicates:
            - Path=/api/shares/**

        - id: api-docs-route
          uri: ${clouddrive.gateway.user-uri}
          predicates:
            - Path=/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

        - id: monolith-health-route
          uri: ${clouddrive.gateway.user-uri}
          predicates:
            - Path=/backend-actuator/**
          filters:
            - StripPrefix=1

clouddrive:
  security:
    jwt:
      # Day25：网关验签用的密钥，必须与单体、auth-service 完全相同。
      # 三个进程共享一把对称密钥是 HS256 的固有代价，已作为已知局限记录。
      secret: ${CLOUDDRIVE_JWT_SECRET:}

  gateway:
    # Day25 起 auth-uri 与另外两个**分道扬镳**：Day24 时三个属性解析出同一个地址，
    # 今天 auth-uri 指向真正独立的 auth-service 进程（8081），
    # user/file 仍指向单体（8080）。这一行的分叉就是"第一个可验证拆分"本身。
    auth-uri: ${CLOUDDRIVE_AUTH_URI:http://127.0.0.1:8081}
    user-uri: ${CLOUDDRIVE_APP_URI:http://127.0.0.1:8080}
    file-uri: ${CLOUDDRIVE_APP_URI:http://127.0.0.1:8080}

    authn:
      # Day25：网关成为边缘验签点。默认开启——与 Nacos 那类"需要外部中间件才能用"的
      # 开关不同，鉴权不依赖任何外部服务，默认关闭反而会让一个不安全的形态成为默认形态。
      enabled: true
      # 这份清单与单体 SecurityConfiguration 的 permitAll 集合逐条对应。
      # GatewayAnonymousPathParityTest 会断言两边不漂移。
      anonymous:
        - /api/auth/register
        - /api/auth/login
        - /api/shares/*/download
        - /actuator/**
        - /v3/api-docs/**
        - /swagger-ui/**
        - /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        # gateway 端点用于查看网关自己解析出来的真实路由表，是本日手工验收的证据来源。
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
