# ============================================================
# 云盘 Nginx 站点配置
#
# 【两种用法】
# 用法 A（推荐，宝塔用户）：站点已在宝塔建好 + SSL 已配，
#   只需把下面这个 server 块里【★标部分】的内容
#   （/api/ 反代 + client_max_body_size）合并进宝塔对应站点的配置文件中。
#   注意：宝塔配置文件里可能已有一份 server 块（含 SSL 证书），
#   别重复创建，只把 location 部分加进去即可。
#
# 用法 B（纯手动）：替换 your-domain.com 为你真实域名，并把
#   SSL 证书路径换成你实际的 .pem/.key，保存到
#   /www/server/panel/vhost/nginx/ 或 /etc/nginx/conf.d/
# ============================================================

server {
    listen 80;
    listen 443 ssl;   # ★ 如已在宝塔配了 SSL，删掉这行，用宝塔自己的 443 块
    server_name mengdecode.com www.mengdecode.com;

    # ★ 替换为你的证书路径（Let's Encrypt 在宝塔里通常自动生成）
    ssl_certificate     /www/server/panel/vhost/cert/mengdecode.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/mengdecode.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 前端静态文件根目录（上传 frontend/ 里的 3 个 html 到这里）
    root /www/wwwroot/mengdecode.com;
    index index.html;

    # === 前端静态资源 ===
    location / {
        try_files $uri $uri/ /index.html;
    }

    # === 后端 API 反代（走网关 8080）===   ★ 这部分是必须加的
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;           # 大文件下载
        client_max_body_size 1100m;        # 大于 Spring 的 1024MB 限制
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # === 备案号（前端页脚已内置，这里留档说明）===
    # 前端 footer 已挂：用户协议 · 隐私政策 · 黔ICP备2026013575号 · 12377
    # 公安备案号下发后，前端 footer 的注释里再补：黔公网安备xxxxx号
}
