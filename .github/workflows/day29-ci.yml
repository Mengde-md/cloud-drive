name: CloudDrive verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: clouddrive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: cloud_drive_learning
          MYSQL_USER: ci_app
          MYSQL_PASSWORD: ci-app-${{ github.run_id }}-${{ github.run_attempt }}
          MYSQL_ROOT_PASSWORD: ci-root-${{ github.run_id }}-${{ github.run_attempt }}
        ports: [3306]
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.2
        ports: [6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - name: Verify five projects against disposable services
        shell: pwsh
        env:
          CLOUDDRIVE_DB_URL: jdbc:mysql://127.0.0.1:${{ job.services.mysql.ports[3306] }}/cloud_drive_learning?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
          CLOUDDRIVE_DB_USERNAME: ci_app
          CLOUDDRIVE_DB_PASSWORD: ci-app-${{ github.run_id }}-${{ github.run_attempt }}
          CLOUDDRIVE_REDIS_HOST: 127.0.0.1
          CLOUDDRIVE_REDIS_PORT: ${{ job.services.redis.ports[6379] }}
          CLOUDDRIVE_REDIS_PASSWORD: ''
        run: |
          $env:CLOUDDRIVE_JWT_SECRET = [Guid]::NewGuid().ToString('N') + [Guid]::NewGuid().ToString('N')
          $env:CLOUDDRIVE_INTERNAL_SERVICE_TOKEN = [Guid]::NewGuid().ToString('N') + [Guid]::NewGuid().ToString('N')
          ./scripts/day29-ci.ps1
