version: "3.9"

# Day23: freezes a reproducible local runtime for CloudDrive's MySQL/Redis
# dependencies. Every credential is supplied through deploy/.env (copied from
# .env.example) — nothing here is a personal credential baked into the file.
# Bring the stack up from the repo root with:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#
# The env var names match src/main/resources/application.properties exactly
# (CLOUDDRIVE_DB_*, CLOUDDRIVE_REDIS_*) so the same .env file that drives this
# compose file also drives the Spring Boot app when run locally.

services:
  mysql:
    image: mysql:8.0
    container_name: clouddrive-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${CLOUDDRIVE_DB_NAME:?set CLOUDDRIVE_DB_NAME in deploy/.env}
      MYSQL_USER: ${CLOUDDRIVE_DB_USERNAME:?set CLOUDDRIVE_DB_USERNAME in deploy/.env}
      MYSQL_PASSWORD: ${CLOUDDRIVE_DB_PASSWORD:?set CLOUDDRIVE_DB_PASSWORD in deploy/.env}
      MYSQL_ROOT_PASSWORD: ${CLOUDDRIVE_DB_ROOT_PASSWORD:?set CLOUDDRIVE_DB_ROOT_PASSWORD in deploy/.env}
    ports:
      - "${CLOUDDRIVE_DB_PORT:-3306}:3306"
    volumes:
      - clouddrive-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${CLOUDDRIVE_DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2
    container_name: clouddrive-redis
    restart: unless-stopped
    command: >
      redis-server --requirepass ${CLOUDDRIVE_REDIS_PASSWORD:?set CLOUDDRIVE_REDIS_PASSWORD in deploy/.env}
    ports:
      - "${CLOUDDRIVE_REDIS_PORT:-6379}:6379"
    volumes:
      - clouddrive-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${CLOUDDRIVE_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Day24: 注册中心 + 配置中心。
  #
  # 用 standalone + embedded 存储（Derby），不接 MySQL：本仓库是学习环境，Nacos 的
  # 数据持久化不是本日要证明的能力，接 MySQL 反而会把"Nacos 起不来"和"Nacos 连不上
  # 业务库"两类故障混在一起。生产环境必须换成 MySQL 存储并做集群，这一点写在
  # docs/architecture/day24-gateway-and-config.md 的局限性一节。
  #
  # 鉴权默认开启（NACOS_AUTH_ENABLE=true）：关掉鉴权的 Nacos 等于把配置中心裸奔在
  # 网络上，任何人都能改线上配置，这是真实事故的常见来源。identity/token 全部来自
  # deploy/.env，compose 文件里没有任何真实口令。
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: clouddrive-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${CLOUDDRIVE_NACOS_AUTH_TOKEN:?set CLOUDDRIVE_NACOS_AUTH_TOKEN in deploy/.env (base64, >= 32 bytes)}
      NACOS_AUTH_IDENTITY_KEY: ${CLOUDDRIVE_NACOS_IDENTITY_KEY:?set CLOUDDRIVE_NACOS_IDENTITY_KEY in deploy/.env}
      NACOS_AUTH_IDENTITY_VALUE: ${CLOUDDRIVE_NACOS_IDENTITY_VALUE:?set CLOUDDRIVE_NACOS_IDENTITY_VALUE in deploy/.env}
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      # 8848 = 控制台与 OpenAPI；9848 = 2.x 的 gRPC 客户端端口，少映射这一个的表现是
      # 控制台能打开、但客户端注册一直超时，是 Nacos 2.x 最常见的踩坑点。
      - "${CLOUDDRIVE_NACOS_PORT:-8848}:8848"
      - "${CLOUDDRIVE_NACOS_GRPC_PORT:-9848}:9848"
    volumes:
      - clouddrive-nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 20

# ------------------------------------------------------------------------------
# Day25 说明：本文件仍然只编排**中间件**（MySQL / Redis / Nacos），没有把单体、
# auth-service、gateway 三个 Java 进程做成 service。
#
# 这是有意的，理由是"不要让 compose 假装已经验证了没验证过的东西"：把三个进程写进
# compose 需要先有可用的镜像构建（Dockerfile + 分层构建 + 健康检查 + 启动顺序依赖），
# 而这些在本会话的沙箱里一次都没有真实执行过。写出来只会得到一份看起来很完整、
# 实际从未跑通的编排文件。
#
# 因此 Day25 的手工验收方式是：用本文件起中间件，三个 Java 进程用
# `java -jar` 或 `mvn spring-boot:run` 在宿主机分别启动，端口分别是
# 8080 / 8081 / 9000。具体命令见 docs/day25/Final.md 的手工验收一节。
#
# 真实形态下"单体端口不对外暴露、一切流量必经网关"这个前提，在宿主机直跑的方式下
# **并不成立**（8080 和 8081 都是可达的）。所以 CLOUDDRIVE_TRUST_GATEWAY_HEADERS
# 在手工验收时也只做对照实验，不当作安全结论。把三个进程容器化、只暴露网关端口，
# 是 Day26 file-service 迁移后一并处理的事。
# ------------------------------------------------------------------------------

volumes:
  clouddrive-mysql-data:
  clouddrive-redis-data:
  clouddrive-nacos-data:
