# ============================================================
# bootstrap.yml - 引导配置文件（在 application.yml 之前加载）
# ============================================================
# 【面试知识点】
# 1. 为什么要用 bootstrap.yml？
#    - Spring Boot 3 中，Nacos 配置中心需要在应用启动的最早阶段加载
#    - bootstrap.yml 的加载优先级高于 application.yml
#    - 需要先引入 spring-cloud-starter-bootstrap 依赖才能生效
#
# 2. Nacos 的两大功能：
#    - 服务发现（discovery）：让微服务之间能互相找到对方，替代硬编码 IP
#    - 配置中心（config）：统一管理配置文件，支持热更新，不用重启服务
# ============================================================
spring:
  application:
    # 服务名称，会在 Nacos 服务列表中显示
    # Gateway 的 lb://user-service 就是通过这个名字找到本服务的
    name: user-service
  cloud:
    nacos:
      # Nacos 服务发现配置
      discovery:
        # Nacos 服务器地址，支持环境变量注入
        # ${NACOS_HOST:127.0.0.1} 表示：优先读环境变量 NACOS_HOST，没有就用默认值
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        # 命名空间，用于环境隔离（dev/test/prod），留空表示使用 public 命名空间
        namespace: ${NACOS_NAMESPACE:}
      # Nacos 配置中心
      config:
        # 配置中心的服务器地址（通常和 discovery 相同）
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        # 配置中心的命名空间
        namespace: ${NACOS_NAMESPACE:}
        # 配置文件的格式，Nacos 支持 yaml、properties 等
        file-extension: yml
