# 测试环境配置（Day07 起）。
# 连接信息一律来自环境变量，不写任何个人凭据；
# 需要真实 MySQL/Redis 的测试都打了 @Tag("integration")，默认构建会跳过。
spring:
  datasource:
    url: ${CLOUD_DRIVE_TEST_DB_URL:jdbc:mysql://127.0.0.1:3306/cloud_drive_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${CLOUD_DRIVE_TEST_DB_USER:clouddrive}
    password: ${CLOUD_DRIVE_TEST_DB_PASSWORD:clouddrive}
  flyway:
    enabled: true
    clean-disabled: false
  data:
    redis:
      host: ${CLOUD_DRIVE_TEST_REDIS_HOST:127.0.0.1}
      port: ${CLOUD_DRIVE_TEST_REDIS_PORT:6379}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

clouddrive:
  storage:
    root: build-output/test-storage
    chunk-root: build-output/test-chunks
  snapshot:
    path: build-output/test-snapshots/entries.txt
  jwt:
    secret: test-only-secret-key-do-not-use-in-production-32
    ttl-minutes: 30

logging:
  level:
    root: WARN
    com.mengde.clouddrive: INFO
