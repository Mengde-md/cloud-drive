server:
  port: 8092

spring:
  application:
    name: file-service
  datasource:
    # 【配置外部化】数据库连接信息通过环境变量注入
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:base_project}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  servlet:
    multipart:
      # 单个文件最大 1024MB（1GB）
      max-file-size: 1024MB
      # 单次请求最大 1024MB
      max-request-size: 1024MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 文件存储配置（也可通过环境变量覆盖）
com:
  base:
    file:
      storage-path: ${FILE_STORAGE_PATH:D:/base-project/files}
      chunk-storage-path: ${CHUNK_STORAGE_PATH:D:/base-project/chunks}
      chunk-expiration-days: ${CHUNK_EXPIRATION_DAYS:1}

# SpringDoc OpenAPI 配置（Swagger UI）
# 访问地址：http://localhost:8092/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.base.files.controller

management:
  server:
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
