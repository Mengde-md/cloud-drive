# Nginx 站点配置（放到 /etc/nginx/conf.d/clouddrive.conf）
#
# 职责：托管前端静态文件 + 把 /api 反代给本机 8080 的 Spring Boot。
# 前后端同源，因此后端完全不需要配 CORS。

server {
    listen       80;
    server_name  _;            # 有域名就换成域名

    charset utf-8;
    access_log /var/log/nginx/clouddrive.access.log;
    error_log  /var/log/nginx/clouddrive.error.log;

    # ===== 最容易踩的一条 =====
    # Nginx 默认只允许 1MB 的请求体，不改的话上传稍大的文件直接返回 413，
    # 而且这个错误发生在 Nginx 层，后端日志里什么都看不到，非常难查。
    # 这个值要和后端 application.yml 里的 max-request-size 对得上。
    client_max_body_size 1024m;
    client_body_timeout  600s;

    # 前端静态文件
    root  /opt/clouddrive/www;
    index index.html;

    location / {
        # SPA 用的是 history 路由，刷新 /files 时 Nginx 会去找这个真实目录（不存在 → 404）。
        # try_files 兜底回 index.html，把路由判断交还给前端。
        try_files $uri $uri/ /index.html;
    }

    # ===== index.html 必须禁止缓存 =====
    # 这是 SPA 部署最典型的坑：assets 里的文件名带 hash，每次打包都变，
    # 而 index.html 的文件名永远不变、里面写着当前该加载哪几个 hash 文件。
    # 如果 index.html 被浏览器缓存，用户拿到的还是旧的那一份，
    # 于是它继续去加载旧的 JS —— 新文件明明已经传上服务器了，界面却一直不更新，
    # 而且强刷有时也没用（因为缓存是"新鲜"的，浏览器根本不发请求）。
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # 静态资源带 hash 文件名，内容一变文件名就变，可以放心长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 本配置中 Nginx 直接面向客户端：覆盖外来转发头，不能追加用户伪造的 IP。
        # 若前面再加 CDN/负载均衡，必须另行配置可信 real_ip 来源，不能照抄任意 XFF。
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-By    "";
        proxy_set_header Forwarded         "";

        # 大文件上传：默认 Nginx 会把整个请求体先落到自己的临时文件再转给后端，
        # 既多一次磁盘往返，也会让上传进度条在前端"瞬间 100%"然后长时间卡住。
        proxy_request_buffering off;
        # 下载：关掉响应缓冲，边收边发，Range 请求的表现才正常。
        proxy_buffering off;

        # 上传下载都是长连接，超时要给够，否则大文件传到一半被掐断
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    location /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }

    # 不要把其它 actuator 端点暴露到公网
    location /actuator/ {
        return 404;
    }
}
