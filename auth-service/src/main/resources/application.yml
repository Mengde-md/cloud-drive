server:
  port: 8090

spring:
  application:
    name: auth-service
  datasource:
    # 【配置外部化】使用环境变量 ${} 语法，冒号后面是默认值
    # 启动时可以通过环境变量覆盖：export DB_HOST=your_host
    # 或者通过 JVM 参数：-DDB_HOST=your_host
    # 生产环境中绝对不要把密码硬编码在配置文件里！
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:base_project}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ============================================================
# SA-Token 配置（轻量级权限认证框架）
# ============================================================
# 【面试知识点】
# 1. SA-Token vs Spring Security：
#    - SA-Token：国产轻量级框架，API 简单，上手快，适合中小型项目
#    - Spring Security：功能强大但配置复杂，适合大型企业项目
#    - 两者都支持：登录认证、权限校验、单点登录、OAuth2 等
#
# 2. Token 存储方式：
#    - 本项目使用 Redis 存储 Token（通过 sa-token-redis-jackson 集成）
#    - 好处：支持分布式部署，多个服务实例共享 Token 信息
#    - 网关和所有微服务都能从 Redis 中读取同一个 Token，实现统一认证
#
# 3. Token 工作流程：
#    - 用户登录 -> 生成 Token -> 存入 Redis -> 返回给前端
#    - 前端每次请求在 Header 中携带 Token
#    - 网关/服务从 Redis 验证 Token 是否有效
# ============================================================
sa-token:
  # Token 名称（请求头中的 key）
  # 前端请求时需要在 Header 中添加：satoken: xxxxx
  token-name: satoken
  # Token 有效期（秒），30天 = 30 * 24 * 60 * 60 = 2592000
  # 过期后用户需要重新登录
  timeout: 2592000
  # Token 最低活跃频率（秒），-1 表示不限制
  # 如果设为 300，表示 5 分钟不操作就过期（类似银行App自动退出）
  active-timeout: -1
  # 是否允许同一账号多地同时登录
  # true：手机和电脑可以同时登录
  # false：后登录的会踢掉先登录的（类似微信）
  is-concurrent: true
  # 多人登录同一账号时是否共用 Token
  # true：多个设备共用同一个 Token（节省 Redis 空间）
  # false：每个设备生成独立的 Token
  is-share: true
  # Token 风格：uuid（32位无横线字符串，如：8f3e9a2b1c4d5e6f7a8b9c0d1e2f3a4b）
  token-style: uuid
  # 是否输出操作日志（开发阶段建议开启，生产环境关闭）
  is-log: true

# ============================================================
# SpringDoc OpenAPI 配置（Swagger UI）
# ============================================================
# 访问地址：http://localhost:8090/swagger-ui.html
# API JSON：http://localhost:8090/v3/api-docs
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.base.auth.controller

# 运维端点仅监听本机；Nginx 不反向代理该端口，避免公网暴露敏感指标。
management:
  server:
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
