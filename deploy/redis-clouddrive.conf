# Redis 调参（追加到 /etc/redis/redis.conf 或 /etc/redis.conf）

# 只监听本机：这台机器上 Redis 不需要对外提供服务，
# 公网暴露的 Redis 是最常见的入侵入口之一。
bind 127.0.0.1
protected-mode yes
requirepass 换成一个强口令

maxmemory 256mb

# ===== 这一条要特别注意 =====
# 不要用 allkeys-lru。本项目的 Redis 里同时放着两类东西：
#   1) 元数据缓存 —— 丢了没关系，下次读会回源数据库；
#   2) Redisson 分布式锁和限流令牌 —— 被驱逐会直接破坏互斥语义，
#      两个上传请求可能同时拿到"锁"。
# 数据量本来就小，宁可写满报错也不要让 Redis 自作主张删键。
maxmemory-policy noeviction

appendonly yes
appendfsync everysec
