server.address=${CLOUDDRIVE_GATEWAY_BIND_ADDRESS:127.0.0.1}
clouddrive.security.jwt.secret=${CLOUDDRIVE_JWT_SECRET}
clouddrive.gateway.auth-uri=${CLOUDDRIVE_AUTH_URI}
clouddrive.gateway.file-uri=${CLOUDDRIVE_FILE_URI}
management.endpoints.web.exposure.include=health,info
management.endpoint.gateway.enabled=false
management.endpoint.health.show-details=never
