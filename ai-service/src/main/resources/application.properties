server.port=${CLOUDDRIVE_AI_PORT:8084}
server.address=127.0.0.1
spring.application.name=cloud-drive-ai-service
spring.jackson.deserialization.fail-on-unknown-properties=true
clouddrive.security.jwt.secret=${CLOUDDRIVE_JWT_SECRET:}
clouddrive.ai.enabled=${CLOUDDRIVE_AI_ENABLED:false}
clouddrive.ai.api-key=${CLOUDDRIVE_AI_API_KEY:}
clouddrive.ai.base-url=https://api.deepseek.com/v1
clouddrive.ai.model=deepseek-flash
clouddrive.ai.protocol-fixture=false
clouddrive.ai.timeout-millis=10000
clouddrive.ai.max-output-tokens=512
clouddrive.ai.max-concurrent-calls=2
clouddrive.rag.enabled=${CLOUDDRIVE_RAG_ENABLED:false}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.async.request-timeout=12000
