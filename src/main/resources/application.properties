spring.datasource.url=${CLOUDDRIVE_DB_URL:jdbc:mysql://127.0.0.1:3306/cloud_drive_learning?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
spring.datasource.username=${CLOUDDRIVE_DB_USERNAME}
spring.datasource.password=${CLOUDDRIVE_DB_PASSWORD}
spring.flyway.enabled=true
mybatis.configuration.map-underscore-to-camel-case=true

# Day14 only: a Redis learning-lab namespace.  Day20 is the first day allowed
# to cache actual CloudDrive metadata; credentials stay in local environment variables.
spring.data.redis.host=${CLOUDDRIVE_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${CLOUDDRIVE_REDIS_PORT:6379}
spring.data.redis.password=${CLOUDDRIVE_REDIS_PASSWORD:}
spring.data.redis.timeout=2s

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Day24: 服务名。它同时是 Nacos 上的服务名和网关 lb:// 后面的目标名，
# gateway/src/main/resources/application-nacos.yml 里的 CLOUDDRIVE_APP_NAME 必须与之一致。
spring.application.name=${CLOUDDRIVE_APP_NAME:cloud-drive-app}

# Day24 默认形态：Nacos 客户端在依赖里但全部关闭。
#
# 为什么默认关：工程门第 6 项是 `mvn clean test` 全绿，而测试不应该要求先手工
# 启动一个外部中间件。关掉之后，90 项回归在没有 Nacos 的机器上行为与 Day23 完全一致；
# 真实注册发现用 `--spring.profiles.active=nacos` 启动（见 application-nacos.properties）。
#
# import-check 这一项尤其容易踩：spring-cloud-starter-alibaba-nacos-config 在
# Spring Boot 3 下默认强制要求存在 spring.config.import=nacos:...，缺了就直接启动失败，
# 报错信息是 "No spring.config.import property has been defined"，看上去完全不像 Nacos 的问题。
spring.cloud.nacos.discovery.enabled=false
spring.cloud.nacos.config.enabled=false
spring.cloud.nacos.config.import-check.enabled=false

# Day24: 由代码实时生成的 OpenAPI 文档入口。安全配置里 anyRequest().permitAll()
# 已经放行这两个路径，因此不需要为本日改动 SecurityConfiguration。
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Day15: the signing secret must be supplied by the deployment environment.
clouddrive.security.jwt.secret=${CLOUDDRIVE_JWT_SECRET:}
clouddrive.security.jwt.ttl=30m

# Day25: 是否信任网关注入的 X-User-* 身份头。**默认 false。**
#
# 关闭时 TrustedGatewayHeaderAuthenticationFilter 第一行即放行，行为与 Day24 完全一致，
# 全部既有回归仍然走本地 JWT 验签这条路径。
#
# 只有在"单体端口不对外暴露、一切流量必经网关"的部署形态下才置为 true
# （见 deploy/docker-compose.yml：单体不再 ports 映射，只有网关映射到宿主机）。
# 置 true 而端口仍然裸露 = 任何人都可以自称任意 userId，这是本开关最重要的一句说明。
clouddrive.gateway.trusted-headers.enabled=${CLOUDDRIVE_TRUST_GATEWAY_HEADERS:false}
