openapi: 3.0.3
info:
  title: CloudDrive Day22 API
  version: 0.1.0
paths:
  /api/entries/page:
    get:
      summary: Page active entries for the authenticated owner
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses: {'200': {description: Active entry page}, '401': {description: Unauthenticated}}
  /api/entries/trash:
    get:
      summary: Page the authenticated owner's recycle bin
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses: {'200': {description: Trash page}, '401': {description: Unauthenticated}}
    delete:
      summary: Permanently remove only the authenticated owner's trashed entries
      responses: {'204': {description: Purged}, '401': {description: Unauthenticated}}
  /api/entries/trash/{id}/restore:
    post:
      summary: Restore one of the authenticated owner's trashed entries
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses: {'204': {description: Restored}, '404': {description: Missing or not owned}, '409': {description: Active sibling name conflict}}
  /actuator/health:
    get:
      summary: Liveness/readiness health endpoint
      security: []
      responses: {'200': {description: Health status}}
components:
  parameters:
    Page: {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
    Size: {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
