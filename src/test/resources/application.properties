# 注意：这个文件与 src/main/resources/application.properties **同名**。
#
# 在测试 classpath 上 build-output/test-classes 排在 build-output/classes 前面，
# Spring Boot 加载 classpath:/application.properties 时只会拿到**第一个**匹配，
# 也就是本文件——主配置里的内容在测试中完全不生效，而且不会有任何提示。
#
# Day24 踩过这个坑：Nacos 的三行禁用开关只加在主配置里，测试读不到，
# spring-cloud-commons 的 ConfigDataMissingEnvironmentPostProcessor 于是按默认值
# （启用）执行检查，抛 "No spring.config.import set"，43 个 Spring 上下文测试
# 在启动阶段全部失败。所以凡是"测试也必须生效"的配置，两份文件都要写。

# Test-only signing material; it is not a deployment secret.
clouddrive.security.jwt.secret=day15-test-only-signing-material-at-least-32-bytes

# Day24: 与主配置保持一致的服务名。
spring.application.name=${CLOUDDRIVE_APP_NAME:cloud-drive-app}

# Day24: 默认形态下 Nacos 全部关闭。测试不依赖任何外部中间件，
# 这三行必须与主配置一致，缺一行就会让全部 Spring 上下文测试在启动阶段失败。
spring.cloud.nacos.discovery.enabled=false
spring.cloud.nacos.config.enabled=false
spring.cloud.nacos.config.import-check.enabled=false
