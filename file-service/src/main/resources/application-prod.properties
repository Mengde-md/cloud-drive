spring.datasource.url=${CLOUDDRIVE_DB_URL}
spring.datasource.username=${CLOUDDRIVE_DB_USERNAME}
spring.datasource.password=${CLOUDDRIVE_DB_PASSWORD}
spring.data.redis.host=${CLOUDDRIVE_REDIS_HOST}
spring.data.redis.port=${CLOUDDRIVE_REDIS_PORT}
spring.data.redis.password=${CLOUDDRIVE_REDIS_PASSWORD}
clouddrive.security.jwt.secret=${CLOUDDRIVE_JWT_SECRET}
clouddrive.internal.service-token=${CLOUDDRIVE_INTERNAL_SERVICE_TOKEN}
clouddrive.storage.root=${CLOUDDRIVE_STORAGE_ROOT}
clouddrive.chunk-storage.root=${CLOUDDRIVE_CHUNKS_ROOT}
spring.cloud.openfeign.client.config.cloud-drive-auth.url=${CLOUDDRIVE_AUTH_URI}
spring.cloud.openfeign.client.config.cloud-drive-user.url=${CLOUDDRIVE_USER_URI}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
