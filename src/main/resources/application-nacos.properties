# Day24 真实形态：用 `--spring.profiles.active=nacos` 启动单体进程时才生效。
#
# 这一份与默认形态的差别只有一件事：进程启动后把自己注册到 Nacos，并从 Nacos
# 拉取可覆盖的配置。业务代码、数据源、安全配置一行都不变——这是"配置隔离"的意思：
# 环境差异只体现在配置层，不体现在代码层，也不体现在要不要改主配置文件。

# 允许 Nacos 上不存在该 dataId 时照常启动。第一次起 Nacos 时上面一条配置都没有，
# 去掉 optional: 前缀会让应用直接启动失败。
spring.config.import=optional:nacos:${CLOUDDRIVE_APP_NAME:cloud-drive-app}.properties

spring.cloud.nacos.discovery.enabled=true
spring.cloud.nacos.discovery.server-addr=${CLOUDDRIVE_NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.discovery.username=${CLOUDDRIVE_NACOS_USERNAME:}
spring.cloud.nacos.discovery.password=${CLOUDDRIVE_NACOS_PASSWORD:}
# 配置隔离第一层：namespace 隔离环境（dev/test/prod 各自一个 namespace id）。
# 跨 namespace 的服务与配置互相不可见，比"名字加前缀"硬得多。
spring.cloud.nacos.discovery.namespace=${CLOUDDRIVE_NACOS_NAMESPACE:}
# 第二层：group 隔离同一环境内的业务域。
spring.cloud.nacos.discovery.group=${CLOUDDRIVE_NACOS_GROUP:CLOUDDRIVE_GROUP}

spring.cloud.nacos.config.enabled=true
spring.cloud.nacos.config.server-addr=${CLOUDDRIVE_NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.config.username=${CLOUDDRIVE_NACOS_USERNAME:}
spring.cloud.nacos.config.password=${CLOUDDRIVE_NACOS_PASSWORD:}
spring.cloud.nacos.config.namespace=${CLOUDDRIVE_NACOS_NAMESPACE:}
spring.cloud.nacos.config.group=${CLOUDDRIVE_NACOS_GROUP:CLOUDDRIVE_GROUP}
spring.cloud.nacos.config.file-extension=properties
spring.cloud.nacos.config.refresh-enabled=true

# 注意边界：即使 refresh-enabled=true，也只有被配置绑定持有的值能热更新。
# spring.datasource.* 由连接池在启动期一次性读取，在 Nacos 上改了不会生效；
# 想验证热更新，请改一个业务侧的自定义属性（例如 clouddrive.security.jwt.ttl 之外的
# 纯展示属性），不要拿数据源密码做实验。
